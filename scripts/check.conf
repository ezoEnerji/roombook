# scripts/check.conf — the steps behind ./scripts/check (THE single verification contract).
# Stack: .NET 9 (net9.0) · ASP.NET Core Minimal API · xUnit v3
# Format: one step per line ->  <name>: <command>   (steps run in order, fail fast)
#
# ---------------------------------------------------------------------------------------------
# GREENFIELD NO-OP — set at bootstrap. There is no solution yet, so there are no active steps and
# ./scripts/check exits green with a note. This is only honest while there is genuinely no code.
#
# The first spec (S-001, solution skeleton) MUST uncomment the three steps below in the same pull
# request that creates RoomBook.sln — leaving them commented once code exists means the project has
# no verification contract, which invalidates every "done" claim (invariant 4).
# ---------------------------------------------------------------------------------------------
#
# format: dotnet format RoomBook.sln --verify-no-changes
# build: dotnet build RoomBook.sln --nologo -warnaserror
# test: dotnet test RoomBook.sln --nologo
