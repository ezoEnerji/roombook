name: check
on:
  push:
  pull_request:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Workspace health
        run: ./scripts/doctor

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Verification contract
        run: |
          if [ -f scripts/check.conf ]; then
            ./scripts/check
          else
            echo "scripts/check.conf not present yet (pre-bootstrap) — skipping."
          fi
      - name: Vulnerable packages
        run: |
          if ls **/*.sln >/dev/null 2>&1 || ls *.sln >/dev/null 2>&1; then
            dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
            ! grep -q 'has the following vulnerable packages' vuln.txt
          else
            echo "no solution yet — skipping vulnerability scan."
          fi
